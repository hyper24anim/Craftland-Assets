<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craftland Studio Assets</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 650px;
    }

    /* Til Tanlash Ekrani Modal Modal/Overlay */
    #langModal {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #09090b;
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 35px 25px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.9);
      text-align: center;
      width: 100%;
    }

    .lang-title-group {
      margin-bottom: 25px;
    }

    .lang-title-group h2 {
      font-size: 18px;
      color: #f4f4f5;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .lang-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    .btn-lang-select {
      background-color: #121215;
      border: 1px solid #27272a;
      color: #ffffff;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 1px;
    }

    .btn-lang-select:hover {
      background-color: #2563eb;
      border-color: #2563eb;
    }

    .btn-lang-select:active {
      transform: scale(0.97);
    }

    /* Asosiy Content (Boshida yashiringan bo'ladi) */
    #mainContent {
      display: none;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding-top: 10px;
    }
    header h1 {
      font-size: 26px;
      letter-spacing: 1px;
      color: #ffffff;
    }
    header p {
      color: #a1a1aa;
      font-size: 14px;
      margin-top: 5px;
    }
    .asset-card {
      background-color: #09090b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      margin-bottom: 25px;
    }
    .badge {
      display: inline-block;
      background-color: #22c55e;
      color: #000;
      font-weight: bold;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .asset-title {
      font-size: 20px;
      margin-bottom: 12px;
      color: #f4f4f5;
    }
    .preview-img {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #27272a;
      margin-bottom: 16px;
    }
    .code-box {
      background-color: #121215;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 14px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      color: #38bdf8;
      word-break: break-all;
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    .btn-copy {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .btn-copy:hover {
      background-color: #1d4ed8;
    }
    .btn-copy:active {
      transform: scale(0.98);
    }
    .coming-soon {
      text-align: center;
      margin-top: 20px;
      padding: 30px;
      border: 1px dashed #27272a;
      border-radius: 16px;
      background-color: #050505;
    }
    .coming-soon h3 {
      font-size: 15px;
      color: #a1a1aa;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- 1. TILNI TANLASH EKRANI -->
    <div id="langModal">
      <div class="lang-title-group">
        <h2>Tilni tanlang</h2>
        <h2>Выберите язык</h2>
        <h2>Select language</h2>
      </div>

      <div class="lang-buttons">
        <button class="btn-lang-select" onclick="chooseLanguage('uz')">O'ZBEKCHA</button>
        <button class="btn-lang-select" onclick="chooseLanguage('ru')">РУССКИЙ</button>
        <button class="btn-lang-select" onclick="chooseLanguage('en')">ENGLISH</button>
      </div>
    </div>

    <!-- 2. ASOSIY SAYT BÖLIMI -->
    <div id="mainContent">
      <header>
        <h1 id="headerTitle">CRAFTLAND STUDIO ASSETLARI</h1>
        <p id="headerSub">Free Fire Craftland ijodkorlari uchun bepul va sifatli resurslar</p>
      </header>

      <!-- Emote Menyu Asset -->
      <div class="asset-card">
        <span class="badge" id="badgeText">BEPUL ASSET</span>
        <h2 class="asset-title" id="assetTitle">Craftland Emote Menyu G'ildiragi</h2>
        
        <img src="9721.jpg" alt="Emote Menyu" class="preview-img">
        
        <div class="code-box">
          <span id="emoteCode">#ASSET871EE30522D04AB69CED367617AA6E505524</span>
        </div>

        <button class="btn-copy" id="emoteBtn" onclick="copyCode('emoteCode', 'emoteBtn')">KODDAN NUSXA OLISH</button>
      </div>

      <!-- Tez Orada -->
      <div class="coming-soon">
        <h3 id="comingSoonText">TEZ ORADA YANGI ASSETLAR QO'SHILADI...</h3>
      </div>
    </div>

  </div>

  <script>
    const translations = {
      uz: {
        headerTitle: "CRAFTLAND STUDIO ASSETLARI",
        headerSub: "Free Fire Craftland ijodkorlari uchun bepul va sifatli resurslar",
        badgeText: "BEPUL ASSET",
        assetTitle: "Craftland Emote Menyu G'ildiragi",
        copyBtn: "KODDAN NUSXA OLISH",
        copiedBtn: "NUSXA OLINDI!",
        comingSoon: "TEZ ORADA YANGI ASSETLAR QO'SHILADI..."
      },
      ru: {
        headerTitle: "АССЕТЫ CRAFTLAND STUDIO",
        headerSub: "Бесплатные качественные ресурсы для авторов Free Fire Craftland",
        badgeText: "БЕСПЛАТНЫЙ АССЕТ",
        assetTitle: "Колесо Эмоций Craftland",
        copyBtn: "СКОПИРОВАТЬ КОД",
        copiedBtn: "СКОПИРОВАНО!",
        comingSoon: "СКОРО ПОЯВЯТСЯ НОВЫЕ АССЕТЫ..."
      },
      en: {
        headerTitle: "CRAFTLAND STUDIO ASSETS",
        headerSub: "Free high-quality resources for Free Fire Craftland creators",
        badgeText: "FREE ASSET",
        assetTitle: "Craftland Emote Wheel Menu",
        copyBtn: "COPY CODE",
        copiedBtn: "COPIED!",
        comingSoon: "MORE ASSETS COMING SOON..."
      }
    };

    let selectedLang = "uz";

    function chooseLanguage(lang) {
      selectedLang = lang;

      // Matnlarni almashtirish
      document.getElementById("headerTitle").innerText = translations[lang].headerTitle;
      document.getElementById("headerSub").innerText = translations[lang].headerSub;
      document.getElementById("badgeText").innerText = translations[lang].badgeText;
      document.getElementById("assetTitle").innerText = translations[lang].assetTitle;
      document.getElementById("emoteBtn").innerText = translations[lang].copyBtn;
      document.getElementById("comingSoonText").innerText = translations[lang].comingSoon;

      // Til oyna oynasini berkitish va asosiy contentni ko'rsatish
      document.getElementById("langModal").style.display = "none";
      document.getElementById("mainContent").style.display = "block";
    }

    function copyCode(elementId, buttonId) {
      let rawText = document.getElementById(elementId).innerText;
      let cleanText = rawText.toUpperCase();

      navigator.clipboard.writeText(cleanText).then(() => {
        const btn = document.getElementById(buttonId);
        btn.innerText = translations[selectedLang].copiedBtn;
        btn.style.backgroundColor = "#16a34a";
        
        setTimeout(() => {
          btn.innerText = translations[selectedLang].copyBtn;
          btn.style.backgroundColor = "#2563eb";
        }, 2000);
      });
    }
  </script>

</body>
</html>
